name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      # `17-13`: `npm audit` exits 1 both when it finds a High/Critical advisory and when it cannot
      # reach the advisory endpoint at all. Under a step named "Vulnerability check", the second reads
      # as the first - on 2026-09-04 the registry answered 503 on three consecutive attempts and the
      # only log line was "Process completed with exit code 1", which says "vulnerable" to every
      # reader. They are opposite facts: one is something to fix, the other is nothing having been
      # checked.
      #
      # An outage still fails the build, deliberately. Passing on "could not look" is the silent
      # direction, and it would let a branch merge with its dependencies unchecked while CI reads
      # green - the same reasoning `tools/queue-audit.sh` (ago-root) states for an unreachable GitHub.
      # What changes is that the log now says which of the two happened.
      #
      # Three attempts with backoff, because a bulk POST to the registry is exactly the shape that
      # fails transiently. They are not a fix for a sustained outage and are not meant to be: if the
      # endpoint is genuinely down this stays red, and somebody decides with the reason visible.
      - name: Vulnerability check (npm audit)
        run: |
          for attempt in 1 2 3; do
            if out=$(npm audit --audit-level=high 2>&1); then
              echo "$out"
              exit 0
            fi
            echo "$out"
            if ! echo "$out" | grep -q 'audit endpoint returned an error'; then
              echo "::error title=Vulnerability found::npm audit reports a High or Critical advisory. Read the report above."
              exit 1
            fi
            echo "Attempt $attempt: the advisory endpoint did not answer. Retrying."
            sleep $((attempt * 10))
          done
          echo "::error title=Not checked, the advisory endpoint is unreachable::This is NOT a vulnerability finding. npm audit could not reach the registry on three attempts, so nothing was checked. See docs/runbooks/vulnerability-response.md in ago-root."
          exit 1

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # There is no real hosted deployment for this portfolio project to point a production
      # bundle at (build.mjs's own guard refuses to guess one) - CI builds against the local
      # cluster's own API origin, the same one docs/runbooks/local-dev.md uses, purely to prove
      # the build succeeds and stays under the bundle-size budget on every push.
      - name: Build
        run: npm run build
        env:
          AGO_API_BASE_URL: "http://localhost:5009"
          AGO_COMMIT: ${{ github.sha }}

      - name: Install the UX gate's browser
        run: npx playwright install --with-deps chromium

      - name: Rendered UX gate
        # `15-11`. **Blocking here, unlike in `ago-calendar-console`** - this repository's gate is
        # green, so there is nothing to grandfather. Ten checks over two states (launcher and open
        # panel) at two viewports, plus three fails-before proofs.
        #
        # The gate rebuilds the widget itself through `playwright.config.ts`'s own `webServer`, so it
        # measures the same bundle this job just built rather than a differently-configured one.
        run: npm run ux-gate

      - name: Upload UX gate screenshots
        # On failure too: a picture of the screen a failing assertion describes is most useful exactly
        # when the gate is red.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-gate-screenshots
          path: ux-gate/screenshots/
          retention-days: 30
          if-no-files-found: warn

  # `15-07`/`adr/0051`: the two public demo images are published to GHCR from here, not built on the
  # deployment node. Only on `main`, and only after build-test passed - a pull request never
  # publishes, so a fork or a draft branch cannot put an image into the registry a deploy might
  # later reach for. Modelled directly on ago-chat's own publish-images job (adr/0047).
  #
  # One repository, two images: the widget bundle is byte-identical between them and only the
  # embedded demo page differs (Dockerfile's DEMO_PAGE_DIR). That difference lives in the image
  # *name*, never in the tag, so both images' SHA tags keep meaning exactly one thing.
  publish-images:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # A repository's own GITHUB_TOKEN can write to that repository's own package feed - the same
      # property adr/0018 already relies on for the NuGet feed, so publishing needs no new secret.
      # Only *reading* a private package would, which is exactly why adr/0047 wants these public.
      packages: write
    steps:
      - uses: actions/checkout@v7

      # No docker/login-action: `docker login` with the workflow token does the same thing with one
      # fewer third-party action in the supply chain.
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Note what is NOT passed here: AGO_API_BASE_URL. The Dockerfile carries the deployment's own
      # value as a committed default (adr/0051), so this image is a function of the commit alone -
      # which is the only thing that lets ${{ github.sha }} keep being a truthful name for it.
      # DEMO_PAGE_DIR is passed, and is not an exception: it picks which of the two images is being
      # built, and that choice is already in the image name.
      - name: Build the images
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          set -euo pipefail
          # `adr/0092`: the bundle with no demo page attached - what a tenant's own `<script src>`
          # points at, served at chat-api.reserve-me.ru/widget/. Same Dockerfile, `--target assets`,
          # so it and the demo images below serve byte-identical bundles by construction rather than
          # by anybody remembering to keep two files in step.
          build_assets() {
            local repo="ghcr.io/${{ github.repository_owner }}/ago-widget-assets"
            echo "::group::${repo}"
            docker build \
              --target assets \
              --build-arg "GIT_COMMIT=${{ github.sha }}" \
              -t "${repo}:${{ github.sha }}" \
              -t "${repo}:main" \
              .
            echo "::endgroup::"
          }
          build_assets
          build_one() {
            local name="$1" page="$2"
            local repo="ghcr.io/${{ github.repository_owner }}/${name}"
            echo "::group::${repo}"
            docker build \
              --build-arg "DEMO_PAGE_DIR=${page}" \
              --build-arg "GIT_COMMIT=${{ github.sha }}" \
              -t "${repo}:${{ github.sha }}" \
              -t "${repo}:main" \
              .
            echo "::endgroup::"
          }
          build_one ago-demo-shop1 public-demo
          build_one ago-demo-shop2 public-demo-2

      # Proves the commit actually reached the served files, rather than only the tag. Cheap, and it
      # is the exact property 15-07 exists for - a published image that cannot name its own commit
      # is the 2026-08-25 failure with extra steps. `17-04` moved this check ahead of the push below -
      # it only ever needed the local image (`docker run` on a tag docker just built, no pull), so it
      # was gaining nothing from running after push and a broken image could still have reached the
      # registry before anyone found out.
      - name: Check the images can name their own commit
        run: |
          set -euo pipefail
          for name in ago-widget-assets ago-demo-shop1 ago-demo-shop2; do
            repo="ghcr.io/${{ github.repository_owner }}/${name}"
            served=$(docker run --rm --entrypoint cat "${repo}:${{ github.sha }}" /usr/share/nginx/html/version.json)
            echo "${name}: ${served}"
            echo "${served}" | grep -q '"commit":"${{ github.sha }}"'
            docker run --rm --entrypoint grep "${repo}:${{ github.sha }}" \
              -q '${{ github.sha }}' /usr/share/nginx/html/widget.js
          done

      # `17-04`/`15-06`: scans before push for the same reason ago-chat's own publish-images job does
      # (its ci.yml has the fuller comment) - a scan bolted on after push would let a Critical/High
      # image sit in GHCR before anyone reacted. Same threshold (Critical/High fails, Moderate/Low is
      # reported - docs/runbooks/vulnerability-response.md, ago-root), same digest-pinned invocation,
      # same reason for pinning by digest rather than trusting `aquasecurity/trivy-action`'s tags or a
      # floating `aquasec/trivy` tag (both were compromised in March 2026 - see ago-chat's ci.yml).
      - name: Scan images for known vulnerabilities (Trivy)
        run: |
          set -euo pipefail
          fail=0
          for name in ago-widget-assets ago-demo-shop1 ago-demo-shop2; do
            repo="ghcr.io/${{ github.repository_owner }}/${name}"
            echo "::group::${repo}"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
              image --scanners vuln --severity CRITICAL,HIGH --exit-code 1 --format table \
              "${repo}:${{ github.sha }}" || fail=1
            echo "::endgroup::"
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::At least one image has a Critical/High vulnerability - see the groups above. Nothing was pushed."
            exit 1
          fi

      - name: Push the images
        run: |
          set -euo pipefail
          for name in ago-widget-assets ago-demo-shop1 ago-demo-shop2; do
            repo="ghcr.io/${{ github.repository_owner }}/${name}"
            docker push "${repo}:${{ github.sha }}"
            docker push "${repo}:main"
          done

      - name: Summarise what was published
        run: |
          {
            echo "### Images published"
            echo
            echo "Deploy with: \`./deploy.sh demo-shop1 ${{ github.sha }}\` (ago-deploy/k8s, on the node)"
            echo
            for n in widget-assets demo-shop1 demo-shop2; do
              echo "- \`ghcr.io/${{ github.repository_owner }}/ago-${n}:${{ github.sha }}\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

# `15-08`: every file this image serves (ago-chat.js, demo-boot.js, ago-chat-module-booking.js,
# index.html, version.json, and their .map files) has a fixed filename that changes *content* on
# every deploy - there is no cache-busting-by-filename anywhere in this build (`build.mjs` names
# nothing with a content hash). Stock nginx sends no Cache-Control at all for a static file with no
# directive naming one, which left a real gap: found live 2026-08-30, a browser that had loaded this
# page before a deploy kept running the old file after a normal reload *and* after an explicit
# hard-reload, because nothing told it to revalidate.
#
# `no-cache` (despite the name) does not mean "never cache" - it means "never *trust* a cached copy
# without asking first". nginx already sends ETag/Last-Modified for every static file by default, so a
# revalidation is one small conditional request answered with a cheap 304 when nothing changed, not a
# full re-download. That is the correct policy for a fixed filename whose content can change under it,
# the same reasoning `ago-console`'s own nginx.conf (adr/0051) will apply for its index.html once this
# item's own scope reaches that repository - see `docs/backlog/15-08-static-frontend-cache-headers.md`
# in ago-root for the fuller "why not no-store, why not one policy for every file" reasoning.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}

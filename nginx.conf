# `15-08`: every file this image serves (widget.js, demo-boot.js, widget-module-booking.js,
# index.html, version.json, and their .map files) has a fixed filename that changes *content* on
# every deploy - there is no cache-busting-by-filename anywhere in this build (`build.mjs` names
# nothing with a content hash). Stock nginx sends no Cache-Control at all for a static file with no
# directive naming one, which left a real gap: found live 2026-08-30, a browser that had loaded this
# page before a deploy kept running the old file after a normal reload *and* after an explicit
# hard-reload, because nothing told it to revalidate.
#
# `no-cache` (despite the name) does not mean "never cache" - it means "never *trust* a cached copy
# without asking first". nginx already sends ETag/Last-Modified for every static file by default, so a
# revalidation is one small conditional request answered with a cheap 304 when nothing changed, not a
# full re-download. That is the correct policy for a fixed filename whose content can change under it,
# the same reasoning `ago-console`'s own nginx.conf (adr/0051) will apply for its index.html once this
# item's own scope reaches that repository - see `docs/backlog/15-08-static-frontend-cache-headers.md`
# in ago-root for the fuller "why not no-store, why not one policy for every file" reasoning.
#
# `25-30`: `Access-Control-Allow-Origin: "*"` on every file this server has ever served. Found live -
# `ui/moduleLoader.ts`'s own `import()` of `widget-module-booking.js` is a dynamic import, which the
# browser treats as a `fetch`-shaped cross-origin request subject to CORS (unlike the `<script src>`
# tag that loads `widget.js` itself, which CORS never governs); with no header here at all, that
# import failed on every tenant's own origin except whichever one happened to share this server's own
# origin. A wildcard is the right answer, not a per-tenant allowlist the way the API's own
# `sites.allowed_origins` is: every file here is public, unauthenticated, meant to be embedded on any
# site in the world by design (a tenant's own page, this image's own demo pages) - there is no
# visitor- or tenant-specific data on this server to protect from being read cross-origin, so the
# same reasoning that already makes `widget.js` itself loadable from anywhere applies identically to
# every lazy-loaded module chunk beside it.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri $uri/ =404;
    }
}
